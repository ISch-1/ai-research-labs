[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-labs"
version = "0.1.0"
description = "Reproducible AI research labs: classical ML & statistics, NLP & LLMs, computer vision."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ISch-1" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.12"]
# Runtime of the Lab A model API (what the Docker image installs).
serve = [
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# Everything needed to run the Lab A experiments and tests.
lab-a = [
    "ai-research-labs[serve]",
    "optuna>=3.6",
    "shap>=0.45",
    "httpx>=0.27",
]
# Lab B (NLP & LLMs). On machines without a GPU install the CPU build of PyTorch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
lab-b = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "model2vec>=0.3",
    "datasets>=2.20",
    "faiss-cpu>=1.8",
]
# Lab C (computer vision). CPU-only machines: install PyTorch's CPU build first (see lab-b).
lab-c = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "datasets>=2.20",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["airlab", "lab_a", "lab_a.serving", "lab_b", "lab_c"]

[tool.setuptools.package-dir]
airlab = "common/airlab"
lab_a = "lab-a-predictive/src/lab_a"
lab_b = "lab-b-nlp-llm/src/lab_b"
lab_c = "lab-c-vision/src/lab_c"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
allowed-confusables = ["×", "α", "σ", "–"]
# Line length is enforced by `ruff format`; what is left are long report strings.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["airlab", "lab_a", "lab_b", "lab_c"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["NPY002"]  # tests exercise the legacy global RNG on purpose (set_seed)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: long-running tests, excluded from the default CI run",
    "hf: downloads small models from the Hugging Face Hub",
]
