[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-labs"
version = "0.1.0"
description = "Reproducible AI research labs: classical ML & statistics, NLP & LLMs, computer vision."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ISch-1" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["airlab", "lab_a"]

[tool.setuptools.package-dir]
airlab = "common/airlab"
lab_a = "lab-a-predictive/src/lab_a"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
allowed-confusables = ["×", "α", "σ"]

[tool.ruff.lint.isort]
known-first-party = ["airlab", "lab_a"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["NPY002"]  # tests exercise the legacy global RNG on purpose (set_seed)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests, excluded from the default CI run"]
