services:
  # Lab A model API -> http://localhost:8000/docs
  # (the image build trains the models, so the first build downloads the datasets)
  lab-a-api:
    build:
      context: .
      dockerfile: lab-a-predictive/Dockerfile
    image: ai-research-labs/lab-a-api
    ports:
      - "8000:8000"

  # Experiment tracking UI -> http://localhost:5000
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data:
