name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch first, so pip does not pull the CUDA build)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,lab-a,lab-b,lab-c]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy common lab-a-predictive/src lab-b-nlp-llm/src lab-c-vision/src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      AIRLAB_TRACKING: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch first, so pip does not pull the CUDA build)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,lab-a,lab-b,lab-c,demo]"
      - name: Cache Hugging Face models used by the `hf` tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-${{ hashFiles('tests/lab_b/test_hf_models.py', 'tests/lab_c/test_experiments_smoke.py') }}
      - run: pytest --cov=airlab --cov=lab_a --cov=lab_b --cov=lab_c --cov-report=term-missing
      - name: Smoke experiments (CLI entry points; reports go to the git-ignored runs/smoke)
        run: |
          python -m lab_a.baseline   --config lab-a-predictive/configs/baseline_smoke.yaml
          python -m lab_a.supervised --config lab-a-predictive/configs/a1_smoke.yaml
          python -m lab_a.anomaly    --config lab-a-predictive/configs/a3_smoke_anomaly.yaml
          python -m lab_a.benchmark  --config lab-a-predictive/configs/a4_smoke.yaml
          python -m lab_b.representations --config lab-b-nlp-llm/configs/b1_smoke.yaml
          python -m lab_b.classification  --config lab-b-nlp-llm/configs/b2_smoke.yaml
          python -m lab_b.search          --config lab-b-nlp-llm/configs/b3_smoke.yaml
          python -m lab_b.rag             --config lab-b-nlp-llm/configs/b4_smoke.yaml
          python -m lab_c.fundamentals    --config lab-c-vision/configs/c1_smoke.yaml
          python -m lab_c.transfer        --config lab-c-vision/configs/c2_smoke.yaml
          python -m lab_c.augmentation    --config lab-c-vision/configs/c3_smoke.yaml
          python -m lab_c.interpret       --config lab-c-vision/configs/c5_smoke.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (offline smoke models)
        run: >
          docker build -f lab-a-predictive/Dockerfile -t lab-a-api
          --build-arg EXPORT_CONFIG=lab-a-predictive/configs/a5_export_smoke.yaml
          --build-arg GIT_COMMIT=${GITHUB_SHA::7} .
      - name: Run the container and call the API
        run: |
          docker run -d --name api -p 8000:8000 lab-a-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/models | tee /dev/stderr | grep -q breast_cancer
          curl -sf -X POST localhost:8000/forecast/synthetic_seasonal \
            -H 'content-type: application/json' -d '{"horizon": 3}' | grep -q points
      - if: failure()
        run: docker logs api
