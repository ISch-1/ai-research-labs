experiment: b3_search
seed: 42
datasets: [squad, scifact]
retrievers:
  - bm25
  - tfidf
  - dense:st:sentence-transformers/all-MiniLM-L6-v2
  - dense:st:BAAI/bge-small-en-v1.5
  - hybrid:bm25+dense:st:BAAI/bge-small-en-v1.5
  - rerank:hybrid:bm25+dense:st:BAAI/bge-small-en-v1.5
n_questions: 1000
chunk_dataset: squad
chunk_sizes: [64, 128, 256, 512]
chunk_overlap: 0.25
chunk_retrievers: [bm25, dense:st:BAAI/bge-small-en-v1.5]
