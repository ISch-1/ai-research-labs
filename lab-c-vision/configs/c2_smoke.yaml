# Offline smoke version for CI: MLP vs CNN on synthetic shapes; the pretrained-model part is
# exercised by tests/lab_c/test_hf_models.py instead (it needs downloads).
experiment: c2_smoke
seed: 0
output_dir: runs/smoke
cifar:
  dataset: synthetic_shapes
  mlp_hidden: [32]
  cnn_width: 8
  train: {epochs: 3, lr: 0.003, batch_size: 64, augment: flip+crop}
pets: null
bootstrap_resamples: 100
